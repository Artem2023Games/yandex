<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fc3f1d">
<title>Моя стартовая</title>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --accent: #fc3f1d;
    --accent-dark: #e0350f;
    --accent-rgb: 252, 63, 29;
  }
  body.google {
    --accent: #4285f4;
    --accent-dark: #3367d6;
    --accent-rgb: 66, 133, 244;
  }
  body.bing {
    --accent: #008373;
    --accent-dark: #006b5d;
    --accent-rgb: 0, 131, 115;
  }
  body.mail {
    --accent: #005ff9;
    --accent-dark: #0047c2;
    --accent-rgb: 0, 95, 249;
  }
  body.duck {
    --accent: #de5833;
    --accent-dark: #b8441f;
    --accent-rgb: 222, 88, 51;
  }
  body.yahoo {
    --accent: #6001d2;
    --accent-dark: #4a01a3;
    --accent-rgb: 96, 1, 210;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'YS Text', 'Segoe UI', Arial, sans-serif;
    background: #fff;
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    transition: background 1s ease, color 0.8s ease;
    position: relative;
    overflow-x: hidden;
  }

  /* ============================================================
     ФОН ДЛЯ ТЕМ (небо / звёзды)
     ============================================================ */
  #bgLayer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    transition: opacity 1s ease;
  }

  /* Звёзды (только в тёмной теме) */
  #stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    overflow: hidden;
  }
  body.dark #stars { opacity: 1; }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  /* Облака (только в небесной теме) */
  #clouds {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    overflow: hidden;
  }
  body.sky #clouds { opacity: 1; }
  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 100px;
    filter: blur(1px);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
    animation: floatCloud linear infinite;
  }
  .cloud::before,
  .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before {
    width: 60%; height: 160%;
    left: 15%; top: -70%;
  }
  .cloud::after {
    width: 45%; height: 130%;
    right: 10%; top: -50%;
  }
  @keyframes floatCloud {
    from { transform: translateX(-300px); }
    to   { transform: translateX(calc(100vw + 300px)); }
  }

  /* ============================================================
     ТЁМНАЯ ТЕМА
     ============================================================ */
  body.dark {
    background: linear-gradient(180deg, #0a0a1f 0%, #141432 50%, #1a1a3e 100%);
    color: #eee;
  }
  body.dark .topbar a, body.dark .clock { color: #bbb; }
  body.dark .clock .time { color: #fff; }
  body.dark .clock .date { color: #888; }
  body.dark .logo .rest { color: #fff; }
  body.dark .greeting { color: #aaa; }
  body.dark #q { color: #fff; }
  body.dark #q::placeholder { color: #888; }
  body.dark .quick a { color: #ddd; }
  body.dark .quick a:hover { background: rgba(255,255,255,0.08); }
  body.dark .topbar a:hover { color: var(--accent); }
  body.dark .tool-btn { background: rgba(255,255,255,0.15); color: #fff; }
  body.dark .search-wrap { background: #1a1a2e; }
  body.dark .clock .tz { background: rgba(255,255,255,0.1); color: #fff; }
  body.dark .fact-box { background: rgba(255,255,255,0.05); color: #ccc; }
  body.dark .history-box { background: rgba(255,255,255,0.05); }
  body.dark .history-box a { color: #ccc; }
  body.dark .settings-panel { background: #1a1a2e; color: #fff; }
  body.dark .settings-panel .row { border-color: #333; }
  body.dark .settings-panel .row select { background: #0f0f1e; color: #fff; border-color: #333; }
  body.dark .autocomplete { background: #1a1a2e; }
  body.dark:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap::after { background: #1a1a2e; }
  body.dark.google .search-wrap::after,
  body.dark.bing .search-wrap::after,
  body.dark.mail .search-wrap::after,
  body.dark.duck .search-wrap::after,
  body.dark.yahoo .search-wrap::after { background: #1a1a2e; }

  /* ============================================================
     НЕБЕСНАЯ ТЕМА
     ============================================================ */
  body.sky {
    background: linear-gradient(180deg, #4a90d9 0%, #87ceeb 40%, #b0e0e6 70%, #e0f4ff 100%);
    color: #0a2540;
  }
  body.sky .topbar a,
  body.sky .clock { color: #1a3d5c; }
  body.sky .clock .time { color: #0a2540; }
  body.sky .clock .date { color: #4a6d8c; }
  body.sky .logo .rest { color: #0a2540; }
  body.sky .greeting { color: #1a3d5c; }
  body.sky #q { color: #0a2540; }
  body.sky #q::placeholder { color: #6a8dad; }
  body.sky .quick a { color: #1a3d5c; }
  body.sky .quick a:hover { background: rgba(255,255,255,0.7); }
  body.sky .topbar a:hover { color: var(--accent); }
  body.sky .tool-btn { background: rgba(255,255,255,0.5); color: #1a3d5c; }
  body.sky .tool-btn:hover { background: rgba(255,255,255,0.8); }
  body.sky .search-wrap { background: rgba(255,255,255,0.92); }
  body.sky .clock .tz { background: rgba(255,255,255,0.5); color: #1a3d5c; }
  body.sky .fact-box { background: rgba(255,255,255,0.5); color: #1a3d5c; }
  body.sky .history-box { background: rgba(255,255,255,0.5); }
  body.sky .history-box a { color: #1a3d5c; background: rgba(255,255,255,0.7); }
  body.sky .history-box a:hover { background: var(--accent); color: #fff; }
  body.sky .history-box .title { color: #4a6d8c; }
  body.sky .settings-panel { background: #f0f8ff; color: #0a2540; }
  body.sky .settings-panel .row { border-color: #b0d4e8; }
  body.sky .settings-panel .row label { color: #1a3d5c; }
  body.sky .settings-panel .row select { background: #fff; color: #0a2540; border-color: #b0d4e8; }
  body.sky .autocomplete { background: #f0f8ff; }
  body.sky:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap::after { background: rgba(255,255,255,0.92); }
  body.sky.google .search-wrap::after,
  body.sky.bing .search-wrap::after,
  body.sky.mail .search-wrap::after,
  body.sky.duck .search-wrap::after,
  body.sky.yahoo .search-wrap::after { background: rgba(255,255,255,0.92); }

  /* ============================================================
     АНИМАЦИИ
     ============================================================ */
  @keyframes logoAppear {
    0%   { opacity: 0; transform: scale(0.7) translateY(-20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes searchSlide {
    0%   { transform: translateY(20px); }
    100% { transform: translateY(0); }
  }
  @keyframes tilePop {
    0%   { opacity: 0; transform: scale(0.5) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes flagsDrop {
    0%   { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  .logo {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -3px;
    margin-bottom: 20px;
    user-select: none;
    animation: logoAppear 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.45s ease,
                font-size 0.45s ease;
    transform-origin: center;
  }
  .logo.switching {
    transform: scale(0.5) rotate(-10deg);
    opacity: 0;
  }
  .logo .ya { color: var(--accent); transition: color 0.5s ease; }
  .logo .rest { color: #000; transition: color 0.8s ease; }

  .greeting {
    font-size: 20px;
    color: #666;
    margin-bottom: 20px;
    animation: fadeIn 0.9s 0.3s both;
    transition: color 0.8s ease, opacity 0.25s ease, transform 0.25s ease;
  }

  .search-wrap {
    display: flex;
    width: 100%;
    max-width: 700px;
    height: 52px;
    min-height: 52px;
    border: 2px solid var(--accent);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: box-shadow 0.3s ease, background 0.8s ease, border-color 0.5s ease;
    animation: searchSlide 0.5s ease;
    position: relative;
    align-items: stretch;
  }
  .search-wrap:focus-within {
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.15);
  }
  #q {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    align-self: stretch;
    border: none;
    outline: none;
    padding: 0 18px;
    font-size: 17px;
    background: transparent;
    color: #000;
    transition: color 0.8s ease, opacity 0.25s ease, transform 0.25s ease;
    box-sizing: border-box;
    font-family: inherit;
  }
  #go {
    flex: 0 0 auto;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    padding: 0 28px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.5s ease, opacity 0.25s ease, transform 0.25s ease;
    font-family: inherit;
    white-space: nowrap;
    align-self: stretch;
  }
  #go:hover { background: var(--accent-dark); }

  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap {
    border: none;
    padding: 3px;
    background: transparent;
    overflow: visible;
    border-radius: 13px;
  }
  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 13px;
    background: conic-gradient(
      from var(--angle),
      #fc3f1d, #ff7a00, #ff3f8e, #ff6b6b, #fc3f1d
    );
    animation: spin 4s linear infinite;
    z-index: 0;
  }
  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 10px;
    background: #fff;
    z-index: 1;
    transition: background 0.8s ease;
  }
  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) #q,
  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) #go {
    position: relative;
    z-index: 2;
    height: 100%;
  }
  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap:focus-within { box-shadow: none; }
  body:not(.google):not(.bing):not(.mail):not(.duck):not(.yahoo) .search-wrap:focus-within::before {
    box-shadow: 0 0 20px rgba(252, 63, 29, 0.4);
  }

  body.google .search-wrap,
  body.bing .search-wrap,
  body.mail .search-wrap,
  body.duck .search-wrap,
  body.yahoo .search-wrap {
    border: none;
    padding: 3px;
    background: transparent;
    overflow: visible;
    border-radius: 13px;
  }
  body.google .search-wrap::before,
  body.bing .search-wrap::before,
  body.mail .search-wrap::before,
  body.duck .search-wrap::before,
  body.yahoo .search-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 13px;
    animation: spin 4s linear infinite;
    z-index: 0;
  }
  body.google .search-wrap::before {
    background: conic-gradient(from var(--angle), #4285f4, #ea4335, #fbbc05, #34a853, #4285f4);
  }
  body.bing .search-wrap::before {
    background: conic-gradient(from var(--angle), #008373, #00b7a4, #00d9c0, #00b7a4, #008373);
  }
  body.mail .search-wrap::before {
    background: conic-gradient(from var(--angle), #005ff9, #ff9e00, #005ff9);
  }
  body.duck .search-wrap::before {
    background: conic-gradient(from var(--angle), #de5833, #f7a072, #de5833);
  }
  body.yahoo .search-wrap::before {
    background: conic-gradient(from var(--angle), #6001d2, #a155ff, #6001d2);
  }

  body.google .search-wrap::after,
  body.bing .search-wrap::after,
  body.mail .search-wrap::after,
  body.duck .search-wrap::after,
  body.yahoo .search-wrap::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 10px;
    background: #fff;
    z-index: 1;
    transition: background 0.8s ease;
  }

  body.google #q, body.google #go,
  body.bing #q, body.bing #go,
  body.mail #q, body.mail #go,
  body.duck #q, body.duck #go,
  body.yahoo #q, body.yahoo #go {
    position: relative;
    z-index: 2;
    height: 100%;
  }

  body.google .search-wrap:focus-within,
  body.bing .search-wrap:focus-within,
  body.mail .search-wrap:focus-within,
  body.duck .search-wrap:focus-within,
  body.yahoo .search-wrap:focus-within { box-shadow: none; }
  body.google .search-wrap:focus-within::before { box-shadow: 0 0 20px rgba(66, 133, 244, 0.4); }
  body.bing .search-wrap:focus-within::before { box-shadow: 0 0 20px rgba(0, 131, 115, 0.4); }
  body.mail .search-wrap:focus-within::before { box-shadow: 0 0 20px rgba(0, 95, 249, 0.4); }
  body.duck .search-wrap:focus-within::before { box-shadow: 0 0 20px rgba(222, 88, 51, 0.4); }
  body.yahoo .search-wrap:focus-within::before { box-shadow: 0 0 20px rgba(96, 1, 210, 0.4); }

  .autocomplete {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 2px solid var(--accent);
    border-top: none;
    border-radius: 0 0 12px 12px;
    margin-top: -2px;
    display: none;
    z-index: 30;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: background 0.8s ease, border-color 0.5s ease;
  }
  .autocomplete.show { display: block; }
  .autocomplete .item {
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 2;
  }
  .autocomplete .item:hover,
  .autocomplete .item.active {
    background: rgba(var(--accent-rgb), 0.08);
  }
  .autocomplete .item .ico { color: #999; font-size: 14px; }

  .tools {
    position: absolute;
    top: 16px;
    right: 24px;
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .tool-btn {
    background: rgba(0,0,0,0.08);
    color: #333;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s, background 0.8s ease, color 0.8s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-btn:hover { transform: scale(1.1); background: rgba(var(--accent-rgb), 0.2); }

  .topbar {
    position: absolute;
    top: 66px;
    right: 24px;
    display: flex;
    gap: 20px;
    font-size: 14px;
  }
  .topbar a {
    color: #333;
    text-decoration: none;
    transition: color 0.8s ease, opacity 0.25s ease, transform 0.25s ease;
  }
  .topbar a:hover { color: var(--accent); }

  .clock {
    position: absolute;
    top: 16px;
    left: 24px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 14px;
    color: #333;
    transition: color 0.8s ease;
    flex-wrap: wrap;
  }
  .clock .time {
    font-size: 22px;
    font-weight: 600;
    color: #000;
    font-variant-numeric: tabular-nums;
    transition: color 0.8s ease;
  }
  .clock .date {
    color: #888;
    transition: color 0.8s ease, opacity 0.25s ease, transform 0.25s ease;
  }
  .clock .tz {
    background: rgba(0,0,0,0.06);
    color: #333;
    border: none;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    outline: none;
    transition: background 0.8s ease, color 0.8s ease;
  }

  .flags {
    margin-top: 22px;
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    transition: opacity 0.35s ease;
  }
  .flags.hidden { display: none; }

  .flag {
    width: 48px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    transition: transform 0.18s, box-shadow 0.18s;
    text-decoration: none;
    display: block;
    overflow: hidden;
    animation: flagsDrop 0.6s 0.4s both;
    flex-shrink: 0;
  }
  .flag:nth-child(2) { animation-delay: 0.5s; }
  .flag:nth-child(3) { animation-delay: 0.6s; }
  .flag:hover {
    transform: translateY(-3px) scale(1.1);
    box-shadow: 0 6px 18px rgba(0,0,0,0.28);
  }
  .flag svg { width: 100%; height: 100%; display: block; }

  .quick {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    max-width: 620px;
    width: 100%;
  }
  .quick a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #333;
    font-size: 13px;
    padding: 12px 4px;
    border-radius: 10px;
    transition: background 0.8s ease, transform 0.15s, color 0.8s ease;
    cursor: pointer;
    animation: tilePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .quick a:nth-child(1) { animation-delay: 0.15s; }
  .quick a:nth-child(2) { animation-delay: 0.20s; }
  .quick a:nth-child(3) { animation-delay: 0.25s; }
  .quick a:nth-child(4) { animation-delay: 0.30s; }
  .quick a:nth-child(5) { animation-delay: 0.35s; }
  .quick a:nth-child(6) { animation-delay: 0.40s; }
  .quick a:nth-child(7) { animation-delay: 0.45s; }
  .quick a:nth-child(8) { animation-delay: 0.50s; }
  .quick a:nth-child(9) { animation-delay: 0.55s; }
  .quick a:nth-child(10){ animation-delay: 0.60s; }

  .quick a span {
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .quick a:hover { background: #f5f5f5; transform: translateY(-3px); }
  .quick .ico {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    font-weight: 700;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .ico-mail    { background: #ff3f40; }
  .ico-maps    { background: #4caf50; }
  .ico-market  { background: #ffcc00; color: #333; }
  .ico-music   { background: #ff0066; }
  .ico-video   { background: #0066ff; }
  .ico-weather { background: #00a8ff; }
  .ico-dzen    { background: #000000; }
  .ico-youtube { background: #ff0000; }
  .ico-gpt     { background: #10a37f; }
  .ico-deepseek{ background: #4d6bfe; }

  .history-box {
    margin-top: 20px;
    max-width: 700px;
    width: 100%;
    padding: 12px 16px;
    background: #f9f9f9;
    border-radius: 12px;
    font-size: 13px;
    animation: fadeIn 0.6s 0.7s both;
    transition: background 0.8s ease, color 0.8s ease;
  }
  .history-box .title {
    color: #888;
    font-size: 12px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.8s ease, opacity 0.25s ease, transform 0.25s ease;
  }
  .history-box .items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-box a {
    color: #333;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 14px;
    background: #fff;
    transition: background 0.15s, color 0.8s ease;
    border: 1px solid #eee;
  }
  .history-box a:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .history-box .clear {
    font-size: 11px;
    color: #999;
    cursor: pointer;
    text-decoration: underline;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .fact-box {
    margin-top: 20px;
    max-width: 700px;
    width: 100%;
    padding: 14px 18px;
    background: #f5f5f5;
    border-radius: 12px;

function applyLanguage(lang, animate = true) {
  if (lang === currentLang && animate) return;

  const doChange = () => {
    currentLang = lang;
    LS.set('lang', lang);
    document.getElementById('setLang').value = lang;
    document.documentElement.lang = (lang === 'kz') ? 'kk' : (lang === 'by') ? 'be' : lang;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (TRANSLATIONS[lang][key]) {
        el.textContent = TRANSLATIONS[lang][key];
      }
    });

    const q = document.getElementById('q');
    q.placeholder = t('searchPlaceholder');

    renderTimezones();
    updateGreeting();
    updateClock();
    renderFact();

    const logoType = LS.get('logoType', 'yandex');
    setLogoContent(logoType, lang);
  };

  if (animate) {
    document.body.classList.add('lang-changing');
    setTimeout(() => {
      doChange();
      setTimeout(() => {
        document.body.classList.remove('lang-changing');
      }, 60);
    }, 220);
  } else {
    doChange();
  }
}

const clockTime = document.getElementById('clockTime');
const clockDate = document.getElementById('clockDate');
const tzSelect = document.getElementById('tzSelect');

function updateClock() {
  const now = new Date();
  const tz = tzSelect.value || 'Europe/Moscow';

  const fmt = new Intl.DateTimeFormat('ru-RU', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  clockTime.textContent = fmt.format(now);

  const localDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
  const dayName = DATE_LOCALE[currentLang].days[localDate.getDay()];
  const dayNum = localDate.getDate();
  const monthName = DATE_LOCALE[currentLang].months[localDate.getMonth()];

  if (currentLang === 'en') {
    clockDate.textContent = `${dayName}, ${monthName} ${dayNum}`;
  } else if (currentLang === 'kz' || currentLang === 'by') {
    clockDate.textContent = `${dayNum} ${monthName}, ${dayName}`;
  } else {
    clockDate.textContent = `${dayName}, ${dayNum} ${monthName}`;
  }
}

function updateGreeting() {
  const h = new Date().getHours();
  let key = 'night';
  if (h >= 5 && h < 12) key = 'morning';
  else if (h >= 12 && h < 18) key = 'day';
  else if (h >= 18 && h < 23) key = 'evening';
  document.getElementById('greeting').textContent = TRANSLATIONS[currentLang].greeting[key];
}

});

const q = document.getElementById('q');
const go = document.getElementById('go');
const autocompleteEl = document.getElementById('autocomplete');

function getHistory() { return LS.get('history', []); }
function addHistory(text) {
  let h = getHistory().filter(x => x !== text);
  h.unshift(text);
  h = h.slice(0, 10);
  LS.set('history', h);
  renderHistory();
}
function renderHistory() {
  const box = document.getElementById('historyBox');
  const items = document.getElementById('historyItems');
  const show = LS.get('showHistory', true);
  const h = getHistory();
  if (!show || h.length === 0) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  items.innerHTML = '';
  h.forEach(text => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = text;
    a.addEventListener('click', e => {
      e.preventDefault();
      q.value = text;
      doSearch();
    });
    items.appendChild(a);
  });
}

function doSearch() {
  const text = q.value.trim();
  if (!text) { q.focus(); return; }
  addHistory(text);
  const engine = LS.get('logoType', 'yandex');
  const url = ENGINES[engine].url(text);
  window.open(url, '_blank');
  hideAutocomplete();
}

function showAutocomplete() {
  const val = q.value.trim().toLowerCase();
  const h = getHistory();
  if (!val) { hideAutocomplete(); return; }
  const matches = h.filter(x => x.toLowerCase().includes(val) && x.toLowerCase() !== val).slice(0, 6);
  if (matches.length === 0) { hideAutocomplete(); return; }
  autocompleteEl.innerHTML = '';
  matches.forEach(m => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<span class="ico">🕘</span>${m}`;
    d.addEventListener('click', () => {
      q.value = m;
      doSearch();
    });
    autocompleteEl.appendChild(d);
  });
  autocompleteEl.classList.add('show');
}
function hideAutocomplete() { autocompleteEl.classList.remove('show'); }

function renderFact() {
  const show = LS.get('showFact', true);
  const box = document.getElementById('factBox');
  if (!show) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const idx = Math.floor(Date.now() / 60000);
  const fact = FACTS[currentLang][idx % FACTS[currentLang].length];
  const quote = QUOTES[currentLang][idx % QUOTES[currentLang].length];
  document.getElementById('factText').innerHTML =
    `<b>${fact}</b><br><br><span style="color:#888; font-style:italic;">${quote}</span>`;
}

// ============================================================
// НАСТРОЙКИ
// ============================================================
const settingsPanel = document.getElementById('settingsPanel');
function openSettings() { settingsPanel.classList.add('show'); }
function closeSettings() { settingsPanel.classList.remove('show'); }

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
function init() {
  const savedLang = LS.get('lang', 'ru');
  applyLanguage(savedLang, false);

  const savedTheme = LS.get('theme', 'light');
  applyTheme(savedTheme);

  applyLogo(LS.get('logoType', 'yandex'), false);
  document.getElementById('setLogo').value = LS.get('logoType', 'yandex');
  document.getElementById('setTheme').value = savedTheme;
  document.getElementById('setFact').value = LS.get('showFact', true) ? 'yes' : 'no';
  document.getElementById('setHistory').value = LS.get('showHistory', true) ? 'yes' : 'no';

  // Создаём звёзды и облака
  createStars();
  createClouds();

  renderHistory();
  updateClock();
  setInterval(updateClock, 1000);
  renderFact();
  setInterval(renderFact, 60000);
}

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================
document.getElementById('setLang').addEventListener('change', e => {
  applyLanguage(e.target.value, true);
});

document.getElementById('setLogo').addEventListener('change', e => {
  LS.set('logoType', e.target.value);
  applyLogo(e.target.value, true);
});

document.getElementById('setTheme').addEventListener('change', e => {
  LS.set('theme', e.target.value);
  applyTheme(e.target.value);
});

document.getElementById('setFact').addEventListener('change', e => {
  LS.set('showFact', e.target.value === 'yes');
  renderFact();
});

document.getElementById('setHistory').addEventListener('change', e => {
  LS.set('showHistory', e.target.value === 'yes');
  renderHistory();
});

document.getElementById('resetAll').addEventListener('click', () => {
  if (confirm('Сбросить все настройки?')) {
    localStorage.clear();
    location.reload();
  }
});

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('closeSettings').addEventListener('click', closeSettings);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSettings();
});

go.addEventListener('click', doSearch);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
  else if (e.key === 'Escape') hideAutocomplete();
});
q.addEventListener('input', showAutocomplete);
q.addEventListener('focus', showAutocomplete);
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) hideAutocomplete();
});

document.getElementById('clearHistory').addEventListener('click', () => {
  LS.set('history', []);
  renderHistory();
});

tzSelect.addEventListener('change', () => {
  LS.set('tz', tzSelect.value);
  updateClock();
});

init();
</script>
</body>
</html>
